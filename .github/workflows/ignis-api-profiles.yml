name: Ignis.Api profile variants

# Layers FHIR profile packages onto the base ignis-api image, producing
# ignis-api-<variant> images (eu, no, se, dk, scandinavian). Manual for now; the matrix
# and tags are structured to grow a FHIR-version axis and to publish on release later.
on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: Base ignis-api tag to layer the profiles onto
        default: canary
        required: true

jobs:
  build:
    name: Build profile variant (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each variant needs a matching infra/fhir-package-lists/<variant>.list.
        variant: ["eu", "no", "se", "dk", "scandinavian"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Check Docker Hub configuration
        id: dockerhub
        env:
          DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_ORG" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
            echo "org=$DOCKERHUB_ORG" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (Docker Hub not configured)
        if: steps.dockerhub.outputs.can_push != 'true'
        run: echo "Docker Hub not configured — profile variants layer onto a published base image, so there is nothing to build. Skipping."

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.can_push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute date-sha stamp
        id: stamp
        run: echo "tag=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        if: steps.dockerhub.outputs.can_push == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.dockerhub.outputs.org }}/ignis-api-${{ matrix.variant }}
          tags: |
            type=raw,value=${{ steps.stamp.outputs.tag }}
            type=raw,value=canary

      - name: Build and push
        if: steps.dockerhub.outputs.can_push == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Ignis.Api/Dockerfile.profiles
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.dockerhub.outputs.org }}/ignis-api:${{ inputs.base_tag }}
            PROFILE_LIST=infra/fhir-package-lists/${{ matrix.variant }}.list
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
